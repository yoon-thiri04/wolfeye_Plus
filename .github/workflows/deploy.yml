name: Deploy to VPS

on:
  push:
    branches: [ "staging" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            # 1. Navigate to project directory
            TARGET_DIR="/opt/wolfeye_Plus"
            if [ -d "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
            else
              cd ~/wolfeye_Plus
            fi

            # 2. Security & Malware Cleanup (Dynamic - User Scoped)
            echo "Running security cleanup for current user..."
            
            # Kill processes owned by current user (github) ONLY if they match the suspicious path
            # We use pgrep to find PIDs and then kill them, avoiding killing the current SSH session
            pgrep -u $(whoami) -f "/var/tmp/" | xargs -r kill -9 || true
            pgrep -u $(whoami) -f "/tmp/" | xargs -r kill -9 || true
            
            # Remove only files owned by the current user in tmp directories
            find /var/tmp -user $(whoami) -delete || true
            find /tmp -user $(whoami) -delete || true
            
            # 3. Pull latest changes efficiently
            git fetch origin staging
            git reset --hard origin/staging

            # 4. Remove Python cache
            find . -name "__pycache__" -type d -exec rm -rf {} +

            # 5. Smart Deploy (Zero Downtime attempt)
            # We DO NOT run 'docker compose down' here. 
            # 'up -d --build' will only recreate changed containers.
            echo "Starting production containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            
            # 6. Aggressive Cleanup to save VPS space
            echo "Cleaning up unused Docker resources..."
            docker image prune -af  # Remove all unused images, not just dangling ones
            docker builder prune -f # Clean build cache
