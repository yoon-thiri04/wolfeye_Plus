version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: wolfeye_plus
    ports:
      - 8000:8000
    depends_on:
      - database
      - redis
    environment:
      - MONGO_URI=mongodb://database:27017
      - MONGO_DB_NAME=aicompliance
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    volumes:
      - ./backend/employee_profiles:/app/backend/employee_profiles
      - ./backend/temp_uploads:/app/backend/temp_uploads
      - deepface_weights:/root/.deepface/weights

  database:
    image: mongo:latest
    container_name: database
    ports:
      - 27017:27017
    volumes:
      - db_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
  deepface_weights:

